services:
  tiku-adapter:
    build: .
    image: tiku-adapter
    container_name: tiku-adapter
    ports:
      - "8060:8060"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - TIKU_ADMIN_PASSWORD=${TIKU_ADMIN_PASSWORD:-changeme}
